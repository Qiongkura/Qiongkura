name: Metrics
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          user: Qiongkura
          template: classic
          plugin_activity: yes
          plugin_activity_limit: 7
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_repositories: yes
          plugin_stargazers: yes
          plugin_followup: yes
